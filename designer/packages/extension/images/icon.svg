<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- 拡張のアイコン(docs/adr/0055)。「常」の字を画面の部品で組み、巾の中心の柱を選んでドラッグしている。images/icon.png はこれから作る -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e2a5a"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="26" fill="url(#bg)"/>
  <!-- ⺌(窓の 3 色の丸) -->
  <circle cx="42" cy="20" r="6.5" fill="#ef4444"/>
  <circle cx="64" cy="16" r="6.5" fill="#f59e0b"/>
  <circle cx="86" cy="20" r="6.5" fill="#22c55e"/>
  <g fill="#fffaf0">
    <!-- 冖 -->
    <path d="M20 30 h88 a3 3 0 0 1 3 3 v15 h-9 v-9 h-76 v9 h-9 v-15 a3 3 0 0 1 3 -3 z"/>
    <!-- 口 -->
    <path fill-rule="evenodd" d="M42 50 h44 a4 4 0 0 1 4 4 v11 a4 4 0 0 1 -4 4 h-44 a4 4 0 0 1 -4 -4 v-11 a4 4 0 0 1 4 -4 z M47 57 v5 h34 v-5 z"/>
    <!-- 巾(中心の柱を除く) -->
    <path d="M26 78 h76 a3 3 0 0 1 3 3 v20 a6 6 0 0 1 -6 6 h-5 v-8 h2 v-13 h-64 v24 h-9 v-29 a3 3 0 0 1 3 -3 z"/>
  </g>
  <!-- 巾の中心の柱(選んでつかみ、左右に動かしている。影で浮かせる)・選択の持ち手・動かす向き・カーソル -->
  <rect x="61.5" y="80.5" width="10" height="37" rx="3" fill="#0b1433" opacity="0.5"/>
  <rect x="59" y="78" width="10" height="37" rx="3" fill="#fde68a"/>
  <g fill="#fffaf0" stroke="#1e2a5a" stroke-width="1">
    <rect x="53" y="72" width="5.5" height="5.5"/>
    <rect x="69.5" y="72" width="5.5" height="5.5"/>
    <rect x="53" y="115.5" width="5.5" height="5.5"/>
    <rect x="69.5" y="115.5" width="5.5" height="5.5"/>
  </g>
  <path d="M43 97 l7 -5 v10 z" fill="#fde68a"/>
  <path d="M85 97 l-7 -5 v10 z" fill="#fde68a"/>
  <path d="M65 93 L65 112 L69.8 107.7 L73.2 115.4 L76.6 113.9 L73.2 106.2 L79.8 106.2 Z" fill="#1f1f1f" stroke="#fffaf0" stroke-width="1.8" stroke-linejoin="round"/>
</svg>
